<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/academy.css"><link rel="stylesheet" href="css/theme.css">
<link rel="icon" href="images/logo.svg">
<script src="site-config.js"></script><title>PDF Notes &middot; Batch 01</title>
<style>
  .pdfx{max-width:1100px;margin:0 auto;padding:18px}
  .pdfx-crumbs{font-size:.9rem;opacity:.8;margin-bottom:12px}
  .pdfx-crumbs a{color:inherit}
  .pdfx h2{margin:0 0 6px}
  .pdfx-sub{opacity:.75;margin:0 0 18px}
  .pdfx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .pdfx-card{display:block;text-align:left;width:100%;padding:18px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.08);color:inherit;font:inherit}
  .pdfx-card:hover{background:rgba(128,128,128,.18)}
  .pdfx-card .ic{font-size:1.8rem;display:block;margin-bottom:8px}
  .pdfx-card strong{display:block;font-size:1.05rem}
  .pdfx-card small{opacity:.7}
  .pdfx-list{display:flex;flex-direction:column;gap:10px}
  .pdfx-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 16px;border-radius:12px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.08)}
  .pdfx-row .t{flex:1;min-width:180px}
  .pdfx-row .t strong{display:block}
  .pdfx-row .t small{opacity:.7}
  .pdfx-btns{display:flex;gap:8px;flex-wrap:wrap}
  .pdfx-btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid rgba(128,128,128,.5);
    background:transparent;color:inherit;text-decoration:none;font:inherit;font-weight:600;cursor:pointer}
  .pdfx-btn:hover{background:rgba(128,128,128,.2)}
  .pdfx-back{margin-bottom:14px}
  .pdfx-viewer{margin-top:18px;border:1px solid rgba(128,128,128,.35);border-radius:12px;overflow:hidden}
  .pdfx-vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;background:rgba(128,128,128,.12)}
  .pdfx-vbar strong{flex:1;min-width:150px}
  .pdfx-viewer iframe{display:block;width:100%;height:78vh;border:0;background:#fff}
  .pdfx-note{padding:10px 14px;font-size:.85rem;opacity:.75}
  .pdfx-empty{padding:24px;border:1px dashed rgba(128,128,128,.5);border-radius:12px;opacity:.8}
</style>
</head>
<body>
<header data-site-header></header>

<div class="pdfx" id="pdfx"></div>

<footer data-site-footer></footer>

<script src="js/site.js"></script>
<!-- YOUR PDF LIST. Edit this one file to add subjects and PDFs. -->
<script src="data/pdfs.js"></script>
<script>
(function () {
  var root = document.getElementById('pdfx');
  var subjects = window.PDF_SUBJECTS || [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function url(f) { return encodeURI(f); }

  function crumbs(extra) {
    return '<div class="pdfx-crumbs"><a href="index.html">Home</a> / <a href="notes.html">Notes</a> / ' +
      (extra ? '<a href="pdfs.html" data-home>PDF Notes</a> / ' + extra : 'PDF Notes') + '</div>';
  }

  function showSubjects() {
    var h = crumbs() + '<h2>PDF Notes</h2><p class="pdfx-sub">Choose a subject. You can read PDFs here or download them.</p>';
    if (!subjects.length) {
      h += '<div class="pdfx-empty">No subjects yet. Add them in <code>data/pdfs.js</code>.</div>';
    } else {
      h += '<div class="pdfx-grid">';
      subjects.forEach(function (s) {
        h += '<button class="pdfx-card" data-subject="' + esc(s.id) + '">' +
          '<span class="ic">' + esc(s.icon || '📄') + '</span>' +
          '<strong>' + esc(s.name) + '</strong>' +
          '<small>' + (s.files ? s.files.length : 0) + ' PDF' + ((s.files && s.files.length === 1) ? '' : 's') + '</small></button>';
      });
      h += '</div>';
    }
    root.innerHTML = h;
    root.querySelectorAll('[data-subject]').forEach(function (b) {
      b.onclick = function () { location.hash = 's=' + encodeURIComponent(b.getAttribute('data-subject')); };
    });
  }

  function showSubject(id) {
    var s = subjects.filter(function (x) { return x.id === id; })[0];
    if (!s) { showSubjects(); return; }
    var files = s.files || [];
    var h = crumbs(esc(s.name)) +
      '<button class="pdfx-btn pdfx-back" id="back">← All subjects</button>' +
      '<h2>' + esc(s.icon || '') + ' ' + esc(s.name) + '</h2><p class="pdfx-sub">' + files.length + ' PDF(s)</p>';
    if (!files.length) {
      h += '<div class="pdfx-empty">No PDFs in this subject yet.</div>';
    } else {
      h += '<div class="pdfx-list">';
      files.forEach(function (f, i) {
        h += '<div class="pdfx-row"><div class="t"><strong>' + esc(f.title) + '</strong>' +
          (f.desc ? '<small>' + esc(f.desc) + '</small>' : '') + '</div>' +
          '<div class="pdfx-btns">' +
          '<button class="pdfx-btn" data-read="' + i + '">📖 Read</button>' +
          '<a class="pdfx-btn" href="' + url(f.file) + '" download>⬇ Download</a>' +
          '</div></div>';
      });
      h += '</div><div id="viewer"></div>';
    }
    root.innerHTML = h;

    document.getElementById('back').onclick = function () { location.hash = ''; };
    root.querySelectorAll('a[data-home]').forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); location.hash = ''; };
    });
    root.querySelectorAll('[data-read]').forEach(function (b) {
      b.onclick = function () { openViewer(files[+b.getAttribute('data-read')]); };
    });
  }

  function openViewer(f) {
    var v = document.getElementById('viewer');
    var u = url(f.file);
    v.innerHTML =
      '<div class="pdfx-viewer">' +
        '<div class="pdfx-vbar"><strong>' + esc(f.title) + '</strong>' +
          '<div class="pdfx-btns">' +
            '<a class="pdfx-btn" href="' + u + '" target="_blank" rel="noopener">Open in new tab</a>' +
            '<a class="pdfx-btn" href="' + u + '" download>⬇ Download</a>' +
            '<button class="pdfx-btn" id="closev">✕ Close</button>' +
          '</div></div>' +
        '<iframe src="' + u + '#view=FitH" title="' + esc(f.title) + '"></iframe>' +
        '<div class="pdfx-note">If the PDF does not show on your phone, use "Open in new tab" or "Download".</div>' +
      '</div>';
    document.getElementById('closev').onclick = function () { v.innerHTML = ''; };
    v.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function route() {
    var m = /^#s=(.+)$/.exec(location.hash);
    if (m) showSubject(decodeURIComponent(m[1])); else showSubjects();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script src="js/protection.js" defer></script>
</body></html>
